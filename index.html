<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒蔵マップ - Sake Brewery Map</title>
    <meta name="description" content="日本全国の酒蔵を地図上で一目で確認できるサービスです。県やジャンル（日本酒・ビール・ワイン等）で絞り込みが可能です。">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍶</text></svg>">

    <!-- OGP Tags -->
    <meta property="og:title" content="酒蔵マップ - Sake Brewery Map">
    <meta property="og:description" content="日本全国の酒蔵を地図上で一目で確認できるサービスです。">
    <meta property="og:url" content="https://kurouzusetsuna.github.io/sakagura-map/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="酒蔵マップ">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #F5F5F0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
            padding: 40px 30px 30px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .controls {
            padding: 25px 30px;
            background: #FAFAF8;
            border-bottom: 1px solid #E8E6E0;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-group label {
            font-weight: 500;
            color: #5A5A5A;
            font-size: 0.95rem;
        }

        .filter-group select {
            padding: 10px 16px;
            border: 1px solid #D0CEC8;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: white;
            cursor: pointer;
            min-width: 150px;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #A0522D;
            box-shadow: 0 0 0 3px rgba(160, 82, 45, 0.1);
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }

        .btn-primary {
            background: #A0522D;
            color: white;
        }

        .btn-primary:hover {
            background: #8B4513;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(160, 82, 45, 0.3);
        }

        .btn-secondary {
            background: #E8E6E0;
            color: #5A5A5A;
        }

        .btn-secondary:hover {
            background: #D8D6D0;
        }

        .info-panel {
            padding: 16px 30px;
            background: #F5F5F0;
            border-bottom: 1px solid #E8E6E0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brewery-count {
            font-weight: 500;
            color: #5A5A5A;
            font-size: 0.95rem;
        }

        .legend {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #5A5A5A;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .marker-new { background: #FF6B6B; }
        .marker-existing { background: #4A90E2; }

        #map {
            width: 100%;
            height: 650px;
        }

        .leaflet-popup-content {
            margin: 18px;
            min-width: 250px;
        }

        .popup-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #8B4513;
            margin-bottom: 10px;
            border-bottom: 2px solid #A0522D;
            padding-bottom: 8px;
        }

        .popup-info {
            font-size: 0.9rem;
            color: #5A5A5A;
            line-height: 1.8;
            margin: 8px 0;
        }

        .popup-label {
            font-weight: 500;
            color: #7A7A7A;
            display: inline-block;
            width: 80px;
        }

        .popup-link {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            background: #A0522D;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .popup-link:hover {
            background: #8B4513;
            transform: translateY(-1px);
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: #F0EEE8;
            color: #6A6A6A;
            border-radius: 12px;
            font-size: 0.8rem;
            margin: 4px 2px;
        }

        .badge-new {
            background: #FF6B6B;
            color: white;
            font-weight: 500;
        }

        footer {
            padding: 24px 30px;
            text-align: center;
            color: #8A8A8A;
            font-size: 0.85rem;
            background: #FAFAF8;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .container {
                border-radius: 0;
            }

            h1 {
                font-size: 1.5rem;
            }

            .controls {
                padding: 20px 15px;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group select {
                width: 100%;
            }

            #map {
                height: 450px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍶 酒蔵マップ</h1>
        <p class="subtitle">日本全国の酒蔵を地図で探す</p>
    </header>

    <div class="controls">
        <div class="filter-group">
            <label for="prefectureFilter">都道府県</label>
            <select id="prefectureFilter">
                <option value="">全て</option>
            </select>
            <label for="genreFilter">ジャンル</label>
            <select id="genreFilter">
                <option value="">全て</option>
            </select>
            <button class="btn btn-primary" onclick="applyFilters()">表示</button>
            <button class="btn btn-secondary" onclick="resetFilters()">全て表示</button>
        </div>
    </div>

    <div class="info-panel">
        <div class="brewery-count" id="breweryCount">読み込み中...</div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-marker marker-new"></div>
                <span>新規追加</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker marker-existing"></div>
                <span>既存</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <footer>
        <p>データは定期的に更新されます。最新情報は各酒蔵の公式サイトをご確認ください。</p>
    </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;
    let allBreweries = [];
    let markers = [];
    let displayedBreweries = new Set(); // 既に表示した酒蔵のIDを記録

    // ローカルストレージのキー
    const STORAGE_KEY = 'sakagura_map_displayed';

    // 地図の初期化
    function initMap() {
        map = L.map('map').setView([36.5, 138.0], 6); // 日本全体を表示

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
    }

    // ローカルストレージから表示済み酒蔵を読み込み
    function loadDisplayedBreweries() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const ids = JSON.parse(stored);
                displayedBreweries = new Set(ids);
                console.log(`Loaded ${displayedBreweries.size} displayed breweries from storage`);
            } catch (e) {
                console.error('Failed to parse stored data:', e);
            }
        }
    }

    // 表示済み酒蔵をローカルストレージに保存
    function saveDisplayedBreweries() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...displayedBreweries]));
        } catch (e) {
            console.error('Failed to save to storage:', e);
        }
    }

    // 酒蔵データの読み込み
    async function loadBreweries() {
        try {
            const response = await fetch('data/breweries.json');
            if (!response.ok) {
                throw new Error('データの読み込みに失敗しました');
            }
            allBreweries = await response.json();

            // フィルタ用のドロップダウンを初期化
            initializeFilters();

            // 全ての酒蔵を表示
            displayBreweries(allBreweries);
            updateBreweryCount(allBreweries.length);

            console.log(`Loaded ${allBreweries.length} breweries`);
        } catch (error) {
            console.error('Error loading breweries:', error);
            document.getElementById('breweryCount').textContent =
                'データの読み込みに失敗しました。';
        }
    }

    // フィルタ用のドロップダウンを初期化
    function initializeFilters() {
        // 都道府県の一覧を取得
        const prefectures = [...new Set(allBreweries.map(b => b.prefecture))].sort();
        const prefectureSelect = document.getElementById('prefectureFilter');
        prefectures.forEach(pref => {
            const option = document.createElement('option');
            option.value = pref;
            option.textContent = pref;
            prefectureSelect.appendChild(option);
        });

        // ジャンルの一覧を取得
        const genres = [...new Set(allBreweries.map(b => b.genre))].sort();
        const genreSelect = document.getElementById('genreFilter');
        genres.forEach(genre => {
            const option = document.createElement('option');
            option.value = genre;
            option.textContent = genre;
            genreSelect.appendChild(option);
        });
    }

    // フィルタをリセット
    function resetFilters() {
        document.getElementById('prefectureFilter').value = '';
        document.getElementById('genreFilter').value = '';
        clearMarkers();
        displayBreweries(allBreweries);
        updateBreweryCount(allBreweries.length);
    }

    // フィルタを適用
    function applyFilters() {
        const selectedPrefecture = document.getElementById('prefectureFilter').value;
        const selectedGenre = document.getElementById('genreFilter').value;

        clearMarkers();

        let filtered = allBreweries;

        // 都道府県でフィルタリング
        if (selectedPrefecture) {
            filtered = filtered.filter(brewery => brewery.prefecture === selectedPrefecture);
        }

        // ジャンルでフィルタリング
        if (selectedGenre) {
            filtered = filtered.filter(brewery => brewery.genre === selectedGenre);
        }

        displayBreweries(filtered);

        // カウント表示を更新
        let filterDesc = '';
        if (selectedPrefecture) filterDesc += selectedPrefecture + ' ';
        if (selectedGenre) filterDesc += selectedGenre + ' ';

        if (filterDesc) {
            updateBreweryCount(filtered.length, filterDesc.trim());
        } else {
            updateBreweryCount(filtered.length);
        }
    }

    // 酒蔵を地図に表示
    function displayBreweries(breweries) {
        breweries.forEach(brewery => {
            const breweryId = `${brewery.prefecture}_${brewery.name}_${brewery.latitude}_${brewery.longitude}`;
            const isNew = !displayedBreweries.has(breweryId);

            // 新規の酒蔵を記録に追加
            if (isNew) {
                displayedBreweries.add(breweryId);
            }

            // マーカーの色を設定（新規は赤、既存は青）
            const iconColor = isNew ? '#FF6B6B' : '#4A90E2';
            const markerIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="background-color: ${iconColor}; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3);"></div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            const marker = L.marker([brewery.latitude, brewery.longitude], { icon: markerIcon }).addTo(map);

            // ポップアップコンテンツの作成
            let popupContent = `<div class="popup-title">${brewery.name}</div>`;

            if (isNew) {
                popupContent += '<span class="badge badge-new">NEW</span>';
            }

            popupContent += `<div class="popup-info">`;

            if (brewery.brand) {
                popupContent += `<div><span class="popup-label">代表銘柄:</span> ${brewery.brand}</div>`;
            }

            popupContent += `<div><span class="popup-label">ジャンル:</span> ${brewery.genre}</div>`;
            popupContent += `<div><span class="popup-label">所在地:</span> ${brewery.prefecture} ${brewery.municipality}</div>`;

            if (brewery.address) {
                popupContent += `<div><span class="popup-label">住所:</span> ${brewery.address}</div>`;
            }

            if (brewery.phone) {
                popupContent += `<div><span class="popup-label">電話:</span> ${brewery.phone}</div>`;
            }

            // バッジ表示
            const badges = [];
            if (brewery.hasVisit) badges.push('<span class="badge">蔵見学可</span>');
            if (brewery.hasShop) badges.push('<span class="badge">売店有</span>');
            if (badges.length > 0) {
                popupContent += `<div style="margin-top: 8px;">${badges.join('')}</div>`;
            }

            popupContent += `</div>`;

            // 公式サイトへのリンク
            if (brewery.website) {
                popupContent += `<a href="${brewery.website}" target="_blank" class="popup-link">公式サイト</a>`;
            }

            marker.bindPopup(popupContent, { maxWidth: 300 });
            markers.push(marker);
        });

        // 地図の表示範囲を調整
        if (markers.length > 0) {
            const group = L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.05));
        }

        // 表示済み酒蔵を保存
        saveDisplayedBreweries();
    }

    // マーカーをクリア
    function clearMarkers() {
        markers.forEach(marker => map.removeLayer(marker));
        markers = [];
    }

    // 酒蔵数の表示を更新
    function updateBreweryCount(count, filter = null) {
        const countEl = document.getElementById('breweryCount');
        if (filter) {
            countEl.textContent = `${filter}: ${count} 件`;
        } else {
            countEl.textContent = `総酒蔵数: ${count} 件`;
        }
    }

    // 初期化
    loadDisplayedBreweries(); // ローカルストレージから読み込み
    initMap();
    loadBreweries();
</script>

</body>
</html>
